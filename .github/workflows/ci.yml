name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  verify-integration-test-registry:
    name: Integration test registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify tests/*.rs map to CI --test flags
        run: ./scripts/check-integration-tests-in-ci.sh

  verify-spdx-headers:
    name: SPDX license headers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Every .rs file must have SPDX-License-Identifier
        run: ./scripts/check-spdx-headers.sh

  verify-no-committed-secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: No live secrets / secret artifacts in the tracked tree
        run: ./scripts/check-no-committed-secrets.sh

  verify-savings-math-dry:
    name: Savings math DRY guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Forbid inline savings math outside the central modules
        run: ./scripts/check-savings-math.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: cargo fmt
        env:
          RUSTC_WRAPPER: ""  # fmt doesn't need sccache
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Build demo UI (required by rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: cargo clippy (with diagnostic capture)
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set +e
          # Write a heartbeat to step summary FIRST so we can at least
          # confirm the step ran even if everything after fails.
          {
            echo "## Clippy diagnostic"
            echo ""
            echo "**Heartbeat:** step started at $(date -u)"
            echo ""
            echo "### Toolchain"
            echo '```'
            rustc --version 2>&1 || echo "rustc --version failed: $?"
            cargo --version 2>&1 || echo "cargo --version failed: $?"
            which cargo-clippy 2>&1 || echo "no cargo-clippy on PATH"
            echo '```'
            echo ""
            echo "### Disk"
            echo '```'
            df -h "$GITHUB_WORKSPACE" /tmp 2>&1 | head -10 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy.log
          rc=${PIPESTATUS[0]}

          {
            echo ""
            echo "### Clippy output (exit $rc)"
            echo '```'
            tail -200 /tmp/clippy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # ── Test jobs: split into 3 parallel groups for ~3x faster wall-clock ──
  # Each job uses a separate GitHub Rust cache and supports a cold build.
  # Split by execution time: unit (~60s), integration-fast (~50s), integration-slow (~70s).

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Build demo UI (required by rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: cargo test --lib
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --lib --locked

  coverage:
    name: Unit Coverage (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Signal, not a gate. A flaky coverage tool must not block merges.
    # When a regression is real, the PR author sees the summary in
    # the job log; when it's noise (a new file without tests added
    # alongside, a cfg-gated branch, etc.) we want to avoid burning
    # review time on it.
    continue-on-error: true
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Install cargo-llvm-cov
        # Install the coverage tool explicitly on the fresh runner.
        run: |
          if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
            cargo install --locked cargo-llvm-cov
          fi
      - name: Build demo UI (required by rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: Run lib tests under llvm-cov
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo llvm-cov --locked --lib --no-report
      - name: Emit summary table (top 20 worst-covered files)
        run: |
          cargo llvm-cov report --summary-only > /tmp/cov-summary.txt
          echo "## Unit-test coverage summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/cov-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Worst-covered files (line %)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Column 10 is line-coverage %, column 1 is filename. Strip
          # the trailing % so `sort -n` orders numerically. Drop the
          # TOTAL and separator rows.
          cargo llvm-cov report \
            | awk 'NR>2 && $1 !~ /^TOTAL/ && $1 !~ /^-/ {gsub(/%/, "", $10); printf "%6s  %s\n", $10, $1}' \
            | sort -n \
            | head -20 \
            >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload lcov artifact
        # LCOV file lets consumers (Codecov, Coveralls, local tooling)
        # drill into individual file / line coverage. Optional — future
        # PR-comment bots plug into this without touching the job.
        if: always()
        run: cargo llvm-cov report --lcov --output-path /tmp/lcov.info || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lcov-coverage
          path: /tmp/lcov.info
          if-no-files-found: ignore

  test-integration:
    name: Integration Tests
    # Always run on PRs (review gate), workflow_dispatch (operator opt-in),
    # and workflow_call (downstream caller). On direct push to main the
    # MinIO suite is skipped UNLESS the commit message contains
    # `[ci-integration]` — opt-in keyword so noisy main-branch chores
    # don't burn ~10 minutes of MinIO time when they don't need it.
    if: >-
      github.event_name != 'push' ||
      contains(github.event.head_commit.message, '[ci-integration]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Wave-1 security (commit 3ff9edc) rejects http:// + private-IP S3
      # endpoints by default to close SSRF surface. The MinIO under test
      # serves on http://localhost:9000, so we explicitly opt in here.
      # The CLI's `engine_factory` auto-sets this when it detects a
      # MinIO/dev endpoint; the proxy's `S3Backend::build_client` does
      # NOT, because the proxy is the thing being hardened.
      DGP_BACKEND_ALLOW_LOCAL: "true"
      # Wave-3 security (commit 9f2e085) caches GET/HEAD SigV4
      # signatures and rejects duplicates inside a 2s window — the
      # default. Tests legitimately re-issue the same signed request
      # within a second (assertion-style verifications) and the AWS
      # SDK signs at one-second timestamp granularity, so two HEADs
      # in the same second collide. Disable replay detection in CI
      # only; production keeps the default.
      DGP_REPLAY_WINDOW_SECS: "0"
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Build demo UI (required by rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: Clean up stale config DB files
        run: |
          rm -f deltaglider_config.db deltaglider_config.db.bak .deltaglider_bootstrap_hash
          rm -f /tmp/deltaglider_config.db /tmp/deltaglider_config.db.bak /tmp/.deltaglider_bootstrap_hash
      - name: Install MinIO client
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$RUNNER_TEMP/mc"
          sudo install -m 0755 "$RUNNER_TEMP/mc" /usr/local/bin/mc
      - name: Start MinIO for tests
        run: |
          docker run -d --name minio-ci -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            mc alias set local http://localhost:9000 minioadmin minioadmin 2>/dev/null && break
            sleep 1
          done
          mc mb --ignore-existing local/deltaglider-test
          mc mb --ignore-existing local/deltaglider-data
          echo "MINIO_ENDPOINT=http://localhost:9000" >> $GITHUB_ENV
      - name: Install DeltaGlider CLI
        env:
          DEBIAN_FRONTEND: noninteractive
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          if ! python3 -m pip --version >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-pip
          fi
          python3 -m venv "$RUNNER_TEMP/deltaglider-cli"
          "$RUNNER_TEMP/deltaglider-cli/bin/pip" install deltaglider
          echo "$RUNNER_TEMP/deltaglider-cli/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/deltaglider-cli/bin:$PATH"
          deltaglider --version
      - name: Integration tests (fast)
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --locked \
            --test bootstrap_password_hash_invariant_test \
            --test auth_integration_test \
            --test concurrency_test \
            --test error_test \
            --test iam_authorization_test \
            --test iam_persona_test \
            --test iam_test \
            --test list_truncation_test \
            --test metadata_validation_test \
            --test s3_api_test \
            --test s3_backend_test \
            --test s3_compat_test \
            --test s3_integration_test \
            --test storage_resilience_test \
            --test unmanaged_objects_test \
            -- --nocapture
      - name: Interop tests (spawns proxy subprocesses)
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --locked --test interop_test -- --include-ignored --nocapture
      - name: Integration tests (admin, IAM, replication, lifecycle, …)
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --locked \
            --test admin_bulk_objects_test \
            --test browser_session_connect_test \
            --test admin_config_test \
            --test admin_login_as_test \
            --test admin_section_test \
            --test bucket_existence_test \
            --test cli_admin_test \
            --test cli_s3_bucket_acl_test \
            --test cli_s3_cp_test \
            --test cli_s3_ls_test \
            --test cli_s3_migrate_test \
            --test cli_s3_purge_test \
            --test cli_s3_rm_test \
            --test cli_s3_stats_test \
            --test cli_s3_sync_test \
            --test cli_s3_verify_test \
            --test config_sync_ha_test \
            --test config_sync_test \
            --test encryption_test \
            --test external_auth_test \
            --test iam_declarative_reconcile_test \
            --test iam_identity_test \
            --test iam_mode_test \
            --test iam_variables_clone_test \
            --test lifecycle_test \
            --test maintenance_reencrypt_test \
            --test migrate_job_test \
            --test quota_test \
            --test replication_test \
            --test streaming_copy_test \
            --test large_object_e2e_test \
            --test parity_test \
            --test savings_test \
            --test admission_test \
            --test aws_chunked_upload_test \
            --test iam_list_scope_test \
            --test multipart_etag_test \
            --test public_prefix_list_test \
            --test public_prefix_test \
            --test recursive_delete_test \
            --test s3_correctness_test \
            -- --nocapture
      - name: Clean up MinIO test data
        if: always()
        run: |
          mc rm --recursive --force local/deltaglider-test/ 2>/dev/null || true
          mc rm --recursive --force local/deltaglider-data/ 2>/dev/null || true
      - name: Stop MinIO
        if: always()
        run: docker rm -f minio-ci 2>/dev/null || true

  test-delta:
    name: Delta & Optimization Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Build demo UI (required by rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: Delta, optimization, and memory tests
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --locked \
            --test delta_test \
            --test optimization_test \
            --test memory_test \
            -- --nocapture

  e2e-smoke:
    name: E2E smoke (embedded UI)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Build demo UI + release binary
        env:
          RUSTC_WRAPPER: ""
        run: |
          cd demo/s3-browser/ui && npm ci && npm run build
          cd ../../.. && cargo build --locked --release --bin deltaglider_proxy
      - name: Install Playwright Chromium
        run: |
          cd demo/s3-browser/ui
          npx playwright install chromium --with-deps
      - name: Smoke test /_/ shell + /_/health
        env:
          DELTAGLIDER_PROXY_BIN: ${{ github.workspace }}/target/release/deltaglider_proxy
        run: ./scripts/e2e-smoke.sh

  audit:
    name: RustSec Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        env:
          RUSTC_WRAPPER: ""  # audit doesn't compile
        run: cargo audit

  deny:
    name: Cargo Deny
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Install cargo-deny
        env:
          RUSTC_WRAPPER: ""
        run: cargo install --locked cargo-deny
      - name: cargo deny check
        env:
          RUSTC_WRAPPER: ""
        run: cargo deny check

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Install dependencies
        run: cd demo/s3-browser/ui && npm ci
      # ── Blocking: ESLint with react-hooks/rules-of-hooks at error.
      #    A regression of error #310 (hooks after early returns) is
      #    caught here, before it ever ships. Warnings are still
      #    visible in logs but don't fail CI — warn budget is being
      #    managed down separately (see lint:strict). ──
      - name: ESLint (rules-of-hooks, no-unused-vars, ...)
        run: cd demo/s3-browser/ui && npm run lint
      # ── Blocking: TypeScript. `recharts` types no longer break this. ──
      - name: TypeScript type check
        run: cd demo/s3-browser/ui && npm run typecheck
      # ── Blocking: Knip detects unused files, deps, and exports. ──
      - name: Knip (dead code / unused deps)
        run: cd demo/s3-browser/ui && npm run knip
      - name: Node regression scripts (permissions + storage paths + page size)
        run: |
          cd demo/s3-browser/ui
          npm run test:permissions
          npm run test:storage-path
          npm run test:page-size
          npm run test:condition-prefix-rows
          npm run test:advanced-merge-patch
          npm run test:permission-conditions
          npm run test:permission-warnings
          npm run test:action-chips
          npm run test:resource-pattern-rows
          npm run test:permission-rows
          npm run test:rule-editor-helpers
          npm run test:credential-generation
          npm run test:overlay-styles
          npm run test:admin-nav-tree
          npm run test:yaml-utils
          npm run test:utils
          npm run test:request-id-suffix
          npm run test:storage-section-payload
          npm run test:backend-encryption-payload
          npm run test:master-detail-filter
          npm run test:trace-request
          npm run test:bulk-clear-selection
          npm run test:dest-prefix
          npm run test:url-state
          npm run test:scan-freshness
          npm run test:rule-names
          npm run test:upload-telemetry
          npm run test:webhook-delivery-payload
          npm run test:keyboard
          npm run test:browser-nav
          npm run test:dropped-files
          npm run test:maintenance-status
          npm run test:jobs-view
          npm run test:admin-path-remap
          npm run test:destination-suggest
          npm run test:hero-number-size
          npm run test:file-preview-mode
          npm run test:make-zip
      - name: npm audit
        run: cd demo/s3-browser/ui && npm audit --audit-level=high

  docs:
    name: Docs bundling + link check + YAML examples
    runs-on: ubuntu-24.04
    # Allow cold compilation on hosted runners; individual network checks stay bounded.
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      # ── Blocking: every .md under docs/product/ is registered in
      #    demo/s3-browser/ui/src/docs-imports.ts, and no dev docs
      #    (docs/dev/**) sneak into the product bundle. ──
      - name: Docs registry allow-list
        run: ./scripts/check-docs-registry.sh
      # ── Blocking: the bundled changelog doc (docs/product/changelog.md)
      #    is generated from the root CHANGELOG.md. Fail if it drifted —
      #    run scripts/gen-changelog-doc.sh and commit. ──
      - name: Changelog doc in sync with CHANGELOG.md
        run: ./scripts/gen-changelog-doc.sh --check
      # ── Blocking: every `# validate`-tagged fenced YAML block in
      #    docs/product/**/*.md parses + validates under the real
      #    schema. Prevents example drift. Needs a built binary. ──
      - name: Build deltaglider_proxy (for config lint)
        run: cd demo/s3-browser/ui && npm ci && npm run build && cd ../../.. && cargo build --locked --release --bin deltaglider_proxy
      - name: Validate docs YAML examples
        env:
          DELTAGLIDER_PROXY_BIN: ./target/release/deltaglider_proxy
        run: ./scripts/check-docs-yaml-examples.sh
      # Inter-doc link checks retain their existing advisory policy.
      - name: Link check (lychee, warn-only)
        # Hard-capped at 4 min. This step is WARN-ONLY (broken links never fail
        # the build), but it both compiles lychee from source AND makes live
        # network requests to external doc URLs — either can hang and was the
        # cause of repeated job-level timeouts (cancelling green release runs).
        # `timeout` bounds the whole thing; on expiry we just warn and move on.
        timeout-minutes: 4
        continue-on-error: true
        env:
          RUSTC_WRAPPER: ""
        run: |
          set +e
          timeout 210 cargo install --locked --quiet lychee || {
            echo "::warning::cargo install lychee failed/timed out; skipping link check"
            exit 0
          }
          timeout 60 lychee --no-progress --accept 200,204,301,302,429 \
            --timeout 20 --max-retries 2 --exclude-mail \
            'docs/product/**/*.md' || {
            echo "::warning::lychee found broken links or timed out; review the log"
          }
          exit 0

  config-schema:
    name: Config JSON Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scrub stale workspace (drop .claude leftovers from prior runs)
        shell: bash
        run: |
          rm -rf .claude/worktrees .git/modules/.claude 2>/dev/null || true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Build demo UI (required by rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: Generate canonical JSON Schema
        run: |
          mkdir -p schema
          cargo run --locked --quiet -- config schema --out schema/deltaglider.schema.json
          echo "--- schema head ---"
          head -40 schema/deltaglider.schema.json
      - name: Lint the canonical example config
        run: |
          # YAML is the only config format (TOML removed in v1.4.1).
          # The shipped example must always pass offline validation.
          cargo run --locked --quiet -- config lint deltaglider_proxy.example.yaml
      - name: Upload schema artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deltaglider-config-schema
          path: schema/deltaglider.schema.json
