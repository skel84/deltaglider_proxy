# Full `cargo test --all` against MinIO. Scheduled so PR CI can stay
# a curated fast subset; this catches drift if a crate is dropped from
# the main workflow by mistake.
name: Test all (nightly)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: test-all-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_INCREMENTAL: "0"

jobs:
  test-all-default-features:
    name: cargo test --all (default features)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # See ci.yml `test-integration` for rationale: MinIO under test
      # serves http://localhost:9000, which the wave-1 SSRF guard
      # rejects unless this is set. DGP_REPLAY_WINDOW_SECS=0 disables
      # the wave-3 GET/HEAD replay cache for tests that legitimately
      # re-issue identical signed requests inside the default 2s
      # window.
      DGP_BACKEND_ALLOW_LOCAL: "true"
      DGP_REPLAY_WINDOW_SECS: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-hosted
      - name: Build demo UI (rust-embed)
        run: cd demo/s3-browser/ui && npm ci && npm run build
      - name: Clean stale config DB artifacts
        run: |
          rm -f deltaglider_config.db deltaglider_config.db.bak .deltaglider_bootstrap_hash
          rm -f /tmp/deltaglider_config.db /tmp/deltaglider_config.db.bak /tmp/.deltaglider_bootstrap_hash
      - name: Install MinIO client and DeltaGlider CLI
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$RUNNER_TEMP/mc"
          sudo install -m 0755 "$RUNNER_TEMP/mc" /usr/local/bin/mc
          python3 -m venv "$RUNNER_TEMP/deltaglider-cli"
          "$RUNNER_TEMP/deltaglider-cli/bin/pip" install deltaglider
          echo "$RUNNER_TEMP/deltaglider-cli/bin" >> "$GITHUB_PATH"
      - name: Start MinIO
        run: |
          # The release image is no longer publicly pullable. Build the same
          # pinned upstream source instead of relying on an untrusted mirror.
          GOTOOLCHAIN=go1.25.6 GOBIN="$RUNNER_TEMP/minio-ci-bin" \
            go install github.com/minio/minio@v0.0.0-20250907161309-07c3a429bfed
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup "$RUNNER_TEMP/minio-ci-bin/minio" server \
            --address 127.0.0.1:9000 "$RUNNER_TEMP/minio-ci-data" \
            > "$RUNNER_TEMP/minio-ci.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/minio-ci.pid"
          for i in $(seq 1 30); do
            mc alias set local http://localhost:9000 minioadmin minioadmin 2>/dev/null && break
            sleep 1
          done
          mc mb --ignore-existing local/deltaglider-test
          mc mb --ignore-existing local/deltaglider-data
          echo "MINIO_ENDPOINT=http://localhost:9000" >> $GITHUB_ENV
      - name: cargo test --all --locked
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --all --locked -- --nocapture
      - name: Stop MinIO
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/minio-ci.pid" ]; then
            minio_pid=$(cat "$RUNNER_TEMP/minio-ci.pid")
            if [ "$(readlink "/proc/$minio_pid/exe" 2>/dev/null || true)" = "$RUNNER_TEMP/minio-ci-bin/minio" ]; then
              kill "$minio_pid"
            fi
          fi

